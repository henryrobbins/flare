# ablation.yaml — default config for ablation.py.

workers: 25
runs: 3

gateway_anthropic: &gateway_anthropic
  base_url: https://aiapi-prod.stanford.edu/anthropic
  api_key_env: STANFORD_AI_API_GATEWAY_KEY
  # The gateway emulates Anthropic structured output with a forced tool call,
  # which suppresses thinking. State the schema in the prompt instead so the
  # reasoning arms actually reason.
  json_mode: prompt

gateway_openai: &gateway_openai
  base_url: https://aiapi-prod.stanford.edu/v1
  api_key_env: STANFORD_AI_API_GATEWAY_KEY

modes:
  - label: regular
    template: flare_nl
    include_implicit: true
  - label: no_definition
    template: no_definition.j2
    include_implicit: true
  - label: allow_implicit
    template: allow_implicit.j2
    include_implicit: false

models:
  - label: opus-5
    client:
      <<: *gateway_anthropic
      model: claude-opus-5
      max_tokens: 16384
      reasoning: true
      reasoning_effort: medium

  - label: gpt-4.1 # no reasoning support
    client:
      <<: *gateway_openai
      model: gpt-4.1
      max_tokens: 8192

  - label: gpt-5.6-sol
    client:
      <<: *gateway_openai
      model: gpt-5.6-sol
      max_tokens: 16384
      reasoning: true
      reasoning_effort: medium

  - label: deepseek-pro
    client:
      model: deepseek-v4-pro
      max_tokens: 16384
      reasoning: true
      reasoning_effort: high
