# ablation_p12.yaml — full model sweep restricted to problem 12.

workers: 25
runs: 3
problems: [12]

modes:
  - label: regular
    template: flare_nl
    include_implicit: true
  - label: no_definition
    template: no_definition.j2
    include_implicit: true
  - label: allow_implicit
    template: allow_implicit.j2
    include_implicit: false

models:
  # == Anthropic models =======================================================

  - label: opus-5
    client: { model: claude-opus-5, max_tokens: 8192 }
  - label: opus-5_reasoning
    client:
      model: claude-opus-5
      max_tokens: 16384
      reasoning: true
      reasoning_effort: medium

  - label: sonnet-5
    client: { model: claude-sonnet-5, max_tokens: 8192 }
  - label: sonnet-5_reasoning
    client:
      model: claude-sonnet-5
      max_tokens: 16384
      reasoning: true
      reasoning_effort: medium

  # == OpenAI models ==========================================================

  - label: gpt-4.1 # no reasoning support
    client: { model: gpt-4.1, max_tokens: 8192 }

  - label: gpt-5.6-sol
    client: { model: gpt-5.6-sol, max_tokens: 8192 }
  - label: gpt-5.6-sol_reasoning
    client:
      model: gpt-5.6-sol
      max_tokens: 16384
      reasoning: true
      reasoning_effort: medium

  - label: gpt-5.6-terra
    client: { model: gpt-5.6-terra, max_tokens: 8192 }
  - label: gpt-5.6-terra_reasoning
    client:
      model: gpt-5.6-terra
      max_tokens: 16384
      reasoning: true
      reasoning_effort: medium

  # == DeepSeek models ========================================================

  - label: deepseek-pro
    client: { model: deepseek-v4-pro, max_tokens: 8192 }
  - label: deepseek-pro_reasoning
    client:
      model: deepseek-v4-pro
      max_tokens: 16384
      reasoning: true
      reasoning_effort: high

  - label: deepseek-flash
    client: { model: deepseek-v4-flash, max_tokens: 8192 }
  - label: deepseek-flash_reasoning
    client:
      model: deepseek-v4-flash
      max_tokens: 16384
      reasoning: true
      reasoning_effort: high
