# baseline_flare.yaml — FLARE only.

workers: 30
runs: 1

verifiers:
  - type: flare
    name: flare-claude-code-opus-5
    harness: claude_code
    compute: modal
    client:
      model: claude-opus-5
      effort: medium

  - type: flare
    name: flare-codex-gpt-5.6-sol
    harness: codex
    compute: modal
    client:
      model: gpt-5.6-sol
      effort: medium

  - type: flare
    name: flare-opencode-deepseek-pro
    harness: opencode
    compute: modal
    client:
      model: deepseek-v4-pro
      effort: high
